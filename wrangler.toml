name = "bangumi-data-api"
main = "worker/worker.js"
compatibility_date = "2024-09-01"
workers_dev = true

# 自定义域名（博客 apiUrl 指向它）
routes = [
  { pattern = "data.201562.xyz", custom_domain = true }
]

# 部署后在这里配置 GitHub 仓库信息
# 也可以到 Cloudflare Dashboard > Worker > Settings > Variables 里配置
[vars]
GITHUB_USER = "skyxnok"
GITHUB_REPO = "bangumi"
GITHUB_BRANCH = "main"
CACHE_TTL = "300"
